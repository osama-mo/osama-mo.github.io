<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070a0e">
    <meta name="description" content="Coming soon. Get in touch at basma.dev25@gmail.com or +905510010125.">
    <title>soon...</title>
    <link rel="preload" href="assets/manrope-extrabold.ttf" as="font" type="font/ttf" crossorigin>
    <style>
        @font-face { font-family: Manrope; src: url('assets/manrope-extrabold.ttf') format('truetype'); font-weight: 800; font-display: swap; }
        :root { color-scheme: dark; --background: #070a0e; --text: #f2f7f8; --accent: #80f7dd; --muted: #a5b8bd; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--background); color: var(--text); font-family: 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
        ::selection { background: var(--accent); color: var(--background); }
        .scene { position: relative; isolation: isolate; display: grid; place-items: center; min-height: 100vh; min-height: 100svh; overflow: hidden; padding: 100px 24px 160px; }
        .scene::before { content: ''; position: absolute; z-index: -2; inset: 0; background: radial-gradient(ellipse at 50% 46%, #12343766, transparent 58%); pointer-events: none; }
        canvas { position: absolute; z-index: -1; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        h1 { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; margin: 0; font: 800 clamp(72px, 13vw, 156px)/1.1 Manrope, sans-serif; letter-spacing: -.04em; }
        .dots { display: flex; color: var(--accent); }
        .dots span { animation: rise 2.2s cubic-bezier(.16, 1, .3, 1) infinite; }
        .dots span:nth-child(2) { animation-delay: .15s; }
        .dots span:nth-child(3) { animation-delay: .3s; }
        .contact { position: absolute; bottom: max(58px, env(safe-area-inset-bottom)); left: 24px; right: 24px; display: flex; align-items: center; justify-content: center; gap: 12px 34px; font-size: 14px; font-style: normal; }
        .contact a { display: flex; align-items: center; gap: 10px; min-height: 44px; color: var(--muted); text-decoration: none; transition: color .2s ease; }
        .contact a:hover { color: var(--accent); }
        .contact svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
        a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
        .motion { position: absolute; right: 28px; bottom: 24px; width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid #314048; border-radius: 50%; background: var(--background); color: var(--muted); cursor: pointer; transition: color .2s ease, border-color .2s ease; }
        .motion:hover { color: var(--accent); border-color: var(--accent); }
        .motion[hidden] { display: none; }
        .motion svg { width: 14px; height: 14px; fill: currentColor; }
        .motion .play { display: none; }
        .is-paused .motion .pause { display: none; }
        .is-paused .motion .play { display: block; }
        .is-paused .dots span { animation-play-state: paused; }
        @keyframes rise { 0%, 60%, 100% { transform: translateY(0); opacity: 1; } 25% { transform: translateY(-18px); opacity: .55; } }
        @media (max-width: 600px) { .contact { bottom: max(76px, env(safe-area-inset-bottom)); flex-direction: column; gap: 0; font-size: 13px; } .motion { right: 18px; bottom: 18px; } }
        @media (prefers-reduced-motion: reduce) { .dots span { animation: none; } .contact a, .motion { transition: none; } }
    </style>
</head>
<body>
    <main class="scene">
        <canvas id="particles" aria-hidden="true"></canvas>
        <h1 aria-label="soon..."><span>soon</span><span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></h1>
        <address class="contact" aria-label="Contact details">
            <a href="mailto:basma.dev25@gmail.com"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>basma.dev25@gmail.com</a>
            <a href="tel:+905510010125"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 3 4 1 1 5-3 2a15 15 0 0 0 6 6l2-3 5 1 1 4c0 1-1 2-2 2A18 18 0 0 1 3 5c0-1 1-2 2-2Z"/></svg>+905510010125</a>
        </address>
        <button class="motion" type="button" aria-label="Pause animation" aria-pressed="false" hidden>
            <svg class="pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h3v10H4zm5 0h3v10H9z"/></svg>
            <svg class="play" viewBox="0 0 16 16" aria-hidden="true"><path d="m5 2 9 6-9 6z"/></svg>
        </button>
    </main>
    <script>
    (() => {
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        const scene = document.querySelector('.scene');
        const button = document.querySelector('.motion');
        const reduced = matchMedia('(prefers-reduced-motion: reduce)');
        let width = 0, height = 0, time = 0, last = 0, frame = 0;
        let pointerX = 0, pointerY = 0, tiltX = 0, tiltY = 0;
        let paused = reduced.matches;
        // Fixed seeds keep the composition stable through resize and pause.
        let seed = 29;
        const random = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
        const motes = Array.from({ length: 1050 }, () => ({ angle: random() * Math.PI * 2, tube: random() * Math.PI * 2, spread: .5 + random() * .5, size: .5 + random() * 1.3, speed: .7 + random() * .6 }));
        const stars = Array.from({ length: 95 }, () => ({ x: random(), y: random(), radius: .3 + random() * .9, phase: random() * 6.28 }));
        function draw() {
            ctx.clearRect(0, 0, width, height);
            const cx = width / 2, cy = height / 2;
            const radius = Math.min(width * .37, height * .31, 300);
            tiltX += (pointerX - tiltX) * .035;
            tiltY += (pointerY - tiltY) * .035;
            for (const star of stars) {
                ctx.fillStyle = `rgba(160,202,212,${.12 + (.5 + .5 * Math.sin(time * .6 + star.phase)) * .25})`;
                ctx.beginPath(); ctx.arc(star.x * width, star.y * height, star.radius, 0, Math.PI * 2); ctx.fill();
            }
            const glow = ctx.createRadialGradient(cx, cy, radius * .35, cx, cy, radius * 1.6);
            glow.addColorStop(0, 'rgba(18,100,94,0)'); glow.addColorStop(.5, 'rgba(18,110,106,.085)'); glow.addColorStop(1, 'rgba(18,100,94,0)');
            ctx.fillStyle = glow; ctx.fillRect(0, 0, width, height);
            const points = [];
            const lean = -.48 + Math.sin(time * .23) * .16 + tiltX * .18;
            const pitch = .79 + Math.sin(time * .31) * .15 + tiltY * .13;
            for (const mote of motes) {
                const a = mote.angle + time * .24 * mote.speed;
                const tube = mote.tube + time * .32;
                const band = radius * .11 * mote.spread;
                const r = radius + Math.cos(tube) * band;
                const x = Math.cos(a) * r;
                const y = Math.sin(a) * r;
                const z = Math.sin(tube) * band;
                const py = y * Math.cos(pitch) - z * Math.sin(pitch);
                const pz = y * Math.sin(pitch) + z * Math.cos(pitch);
                const perspective = 850 / (850 - pz);
                const px = (x * Math.cos(lean) - py * Math.sin(lean)) * perspective;
                const sy = (x * Math.sin(lean) + py * Math.cos(lean)) * perspective;
                points.push({x: cx + px, y: cy + sy, z: pz, size: mote.size * perspective, alpha: .25 + (pz / radius + 1) * .28, hue: 163 + (Math.sin(a + time * .3) + 1) * 17});
            }
            points.sort((a, b) => a.z - b.z);
            ctx.globalCompositeOperation = 'lighter';
            for (const p of points) {
                ctx.fillStyle = `hsla(${p.hue},82%,72%,${p.alpha})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                if (p.size > 1.6) {
                    ctx.fillStyle = `hsla(${p.hue},85%,65%,.055)`;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 4, 0, Math.PI * 2); ctx.fill();
                }
            }
            // Three light trails travel through the particle stream.
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                for (let j = 0; j < 38; j++) {
                    const a = time * .55 + i * Math.PI * 2 / 3 - j * .008;
                    const x = Math.cos(a) * radius, y = Math.sin(a) * radius;
                    const py = y * Math.cos(pitch), pz = y * Math.sin(pitch);
                    const s = 850 / (850 - pz);
                    const px = cx + (x * Math.cos(lean) - py * Math.sin(lean)) * s;
                    const sy = cy + (x * Math.sin(lean) + py * Math.cos(lean)) * s;
                    if (j === 0) ctx.moveTo(px, sy); else ctx.lineTo(px, sy);
                }
                ctx.strokeStyle = 'rgba(134,255,224,.5)'; ctx.lineWidth = 1.2; ctx.stroke();
            }
            ctx.globalCompositeOperation = 'source-over';
        }
        function loop(now) {
            frame = 0;
            if (paused || document.hidden) { last = 0; return; }
            if (last) time += Math.min((now - last) / 1000, .05);
            last = now; draw(); frame = requestAnimationFrame(loop);
        }
        function updateMotion() {
            scene.classList.toggle('is-paused', paused);
            button.setAttribute('aria-label', paused ? 'Play animation' : 'Pause animation');
            button.setAttribute('aria-pressed', String(paused));
            cancelAnimationFrame(frame); frame = 0; last = 0;
            draw();
            if (!paused && !document.hidden) frame = requestAnimationFrame(loop);
        }
        function resize() {
            width = scene.clientWidth; height = scene.clientHeight;
            const dpr = Math.min(devicePixelRatio || 1, 2);
            canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw();
        }
        scene.addEventListener('pointermove', event => { pointerX = event.clientX / width - .5; pointerY = event.clientY / height - .5; });
        scene.addEventListener('pointerleave', () => { pointerX = 0; pointerY = 0; });
        button.addEventListener('click', () => { paused = !paused; updateMotion(); });
        reduced.addEventListener('change', () => { paused = reduced.matches; updateMotion(); });
        document.addEventListener('visibilitychange', updateMotion);
        window.addEventListener('resize', resize);
        button.hidden = false;
        resize(); updateMotion();
    })();
    </script>
</body>
</html>
